<!DOCTYPE html>
<html>
<head>
    <title>X-Ray Disease Detector</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
/* (your CSS unchanged) */
@font-face {
    font-family: 'agency';
    src: url("fonts/agency.otf") format('opentype');
}

*, *::before, *::after { box-sizing: border-box; }

:root {
    --bg-color: #F8FAFC;
    --text-color: #0F172A;
    --card-bg: #FFFFFF;
}

.dark-mode {
    --bg-color: #0F172A;
    --text-color: #E2E8F0;
    --card-bg: #1E293B;
}

body {
    margin: 0;
    width: 100%;
    min-height: 100vh;
    overflow-x: hidden;
    background-color: var(--bg-color);
    color: var(--text-color);
    padding: 60px 16px 24px;
    display: flex;
    justify-content: center;
    flex-direction: column;
    align-items: center;
}

.card {
    background: var(--card-bg);
    padding: 28px 20px;
    border-radius: 20px;
    width: 100%;
    max-width: 480px;
    text-align: center;
}

.bar {
    height: 12px;
    background: green;
    margin-bottom: 10px;
    border-radius: 6px;
}

#preview {
    max-width: 100%;
    width: 250px;
    display: none;
}

.disclaimer {
    color: red;
    font-size: 14px;
}
    </style>
</head>
<body class="dark-mode">

<button onclick="ToggleMode()">Toggle theme</button>

<div class="card">
    <img id="preview">
    <h2>Upload Chest X-Ray</h2>

    <input type="file" id="uploadImage" accept="image/*">
    <br><br>

    <button id="analyzeBtn">Analyze</button>

    <div id="result">Result:</div>
</div>

<p class="disclaimer">This is AI-assisted and not a medical diagnosis.</p>

<script>
document.addEventListener("DOMContentLoaded", function () {

    const uploadInput = document.getElementById('uploadImage');
    const previewImg = document.getElementById('preview');
    const resultsDiv = document.getElementById("result");

    uploadInput.addEventListener('change', function () {
        const file = this.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function (e) {
                previewImg.src = e.target.result;
                previewImg.style.display = 'block';
            };
            reader.readAsDataURL(file);
        }
    });

    function ToggleMode() {
        document.body.classList.toggle("dark-mode");
    }

    function uploadXray() {
        let file = uploadInput.files[0];

        if (!file) {
            resultsDiv.innerHTML = "Please upload an X-ray image first.";
            return;
        }

        resultsDiv.innerHTML = "Analyzing...";

        let formData = new FormData();
        formData.append("xray", file);

        fetch("/detect/", {
            method: "POST",
            body: formData
        })
        .then(res => res.json())
        .then(data => {

            if (!data.predictions || Object.keys(data.predictions).length === 0) {
                resultsDiv.innerHTML = "<p>No significant findings</p>";
                return;
            }

            const confidenceThreshold = 0.6;

            const tbSymptoms = ["Consolidation", "Infiltration", "Effusion", "Nodule", "Mass"];
            const allowedDiseases = ["Cardiomegaly"];

            let tbCount = 0;
            let strongTB = false;

            for (const symptom of tbSymptoms) {
                let value = data.predictions[symptom];

                if (value && value > confidenceThreshold) {
                    tbCount += 1;
                }

                if (value && value > 0.75) {
                    strongTB = true;
                }
            }

            if (tbCount >= 2 && strongTB) {
                resultsDiv.innerHTML = `
                    <div>
                        <strong>Tuberculosis</strong>
                        <div class="bar" style="width:100%"></div>
                    </div>
                `;
                return;
            }

  
            let html = "";

            for (const [disease, confidence] of Object.entries(data.predictions)) {
                if (allowedDiseases.includes(disease) && confidence > confidenceThreshold) {
                    html += `
                        <div>
                            <strong>${disease}</strong>
                            <div class="bar" style="width:${confidence * 100}%"></div>
                        </div>
                    `;
                }
            }

        
            if (html === "") {
                resultsDiv.innerHTML = "<p>No significant findings for Cardiomegaly or Tuberculosis</p>";
            } else {
                resultsDiv.innerHTML = html;
            }

        })
        .catch(err => {
            console.error(err);
            resultsDiv.innerHTML = "Error analyzing image";
        });
    }

    document.getElementById("analyzeBtn").addEventListener("click", uploadXray);

});
</script>

</body>
</html>
